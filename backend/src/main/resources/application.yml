spring:
  application:
    name: api-catalog

  datasource:
    url: jdbc:postgresql://localhost:5432/api_catalog
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

  ai:
    mcp:
      server:
        name: api-catalog-mcp
        version: 1.0.0
        type: SYNC
        protocol: STREAMABLE

server:
  port: 8080

logging:
  level:
    com.apicatalog: DEBUG
    org.springframework.web: INFO

llm:
  enabled: true
  provider: azure-openai
  api-key: ${AZURE_OPENAI_API_KEY}
  model: ${AZURE_OPENAI_DEPLOYMENT:gpt-4o-intern}
  api-version: ${AZURE_OPENAI_API_VERSION:2025-01-01-preview}
  base-url: ${AZURE_OPENAI_ENDPOINT:https://slk-procurement.openai.azure.com}
