spring:
  application:
    name: api-catalog

  datasource:
    url: jdbc:postgresql://localhost:5432/api_catalog
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

  ai:
    mcp:
      server:
        name: api-catalog-mcp
        version: 1.0.0
        type: SYNC
        protocol: STREAMABLE

server:
  port: 8080

logging:
  level:
    com.apicatalog: DEBUG
    org.springframework.web: INFO

llm:
  enabled: true
  provider: openai
  api-key: ${OPENAI_API_KEY:}
  model: ${OPENAI_MODEL:gpt-4.1}
  base-url: ${OPENAI_BASE_URL:https://eisopenai.openai.azure.com/openai}

parser:
  treesitter:
    enabled: true
    node-path: node
    timeout-seconds: 120
