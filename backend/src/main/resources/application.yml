spring:
  application:
    name: api-catalog

  datasource:
    url: jdbc:postgresql://localhost:5432/api_catalog
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

server:
  port: 8080

logging:
  level:
    com.apicatalog: DEBUG
    org.springframework.web: INFO
